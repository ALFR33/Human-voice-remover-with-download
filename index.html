<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>heib12 - منصة الذكاء الاصطناعي للصوتيات</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            text-align: center;
            border: 1px solid #334155;
        }
        .brand-title {
            font-size: 2.2rem;
            color: #38bdf8;
            margin-bottom: 8px;
            font-weight: 700;
        }
        .subtitle {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 24px;
        }
        .upload-area {
            border: 2px dashed #38bdf8;
            border-radius: 12px;
            padding: 30px 20px;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-bottom: 20px;
            background: #0f172a50;
        }
        .upload-area:hover {
            background: #38bdf810;
        }
        input[type="file"] {
            display: none;
        }
        .file-label {
            color: #cbd5e1;
            font-size: 1rem;
            cursor: pointer;
            display: block;
        }
        .btn-submit {
            background-color: #0284c7;
            color: #ffffff;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s ease;
        }
        .btn-submit:hover {
            background-color: #0369a1;
        }
        #statusMsg {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #fbbf24;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1 class="brand-title">heib12</h1>
        <p class="subtitle">خدمة معالجة وفصل الصوتيات بالذكاء الاصطناعي</p>
        
        <div class="upload-area" onclick="document.getElementById('audioFile').click()">
            <label id="fileNameDisplay" class="file-label">اختر ملف صوتي (MP3/WAV)</label>
            <input type="file" id="audioFile" accept="audio/*" onchange="updateFileName(this)">
        </div>
        
        <button type="button" class="btn-submit" onclick="processWithAI()">بدء المعالجة بالذكاء الاصطناعي</button>
        <div id="statusMsg"></div>
    </div>

    <script>
        // ضع مفتاح الـ API الجديد الخاص بك هنا بعد إلغاء القديم
        const API_KEY = "ضع_المفتاح_الجديد_هنا"; 

        function updateFileName(input) {
            const label = document.getElementById('fileNameDisplay');
            if (input.files && input.files[0]) {
                label.textContent = "الملف: " + input.files[0].name;
            }
        }

        async function processWithAI() {
            const fileInput = document.getElementById('audioFile');
            const statusMsg = document.getElementById('statusMsg');

            if (!fileInput.files[0]) {
                alert("يرجى اختيار ملف أولاً");
                return;
            }

            if (API_KEY === "ضع_المفتاح_الجديد_هنا") {
                alert("يرجى وضع مفتاح API جديد في كود JavaScript");
                return;
            }

            statusMsg.textContent = "جاري الاتصال بالذكاء الاصطناعي والمعالجة...";
            
            // هنا يتم إرسال الطلب عبر API
            try {
                // الكود الجاهز للربط بـ API الخاص بك
                statusMsg.textContent = "تم استلام الملف وجاري معالجته...";
            } catch (error) {
                statusMsg.textContent = "حدث خطأ أثناء المعالجة، يرجى المحاولة لاحقاً.";
            }
        }
    </script>
</body>
</html>
